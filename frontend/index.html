<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Basket Analysis Dashboard</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>🛒 Market Basket Analysis</h1>
            <p>Upload your transaction data and discover product associations</p>
        </header>

        <section class="controls">
            <div class="upload-area">
                <h3>1. Upload Data</h3>
                <input type="file" id="fileInput" accept=".csv">
                <button id="uploadBtn">Upload</button>
                <span id="uploadStatus"></span>
            </div>
            <div class="params-area">
                <h3>2. Parameters</h3>
                <label>Min Support: <input type="number" id="minSupport" value="0.02" step="0.001"></label>
                <label>Min Confidence: <input type="number" id="minConfidence" value="0.10" step="0.01"></label>
                <label>Min Product Frequency: <input type="number" id="minFreq" value="20" step="1"></label>
                <button id="analyzeBtn">▶ Run Analysis</button>
            </div>
        </section>

        <section class="stats" id="statsContainer" style="display:none;">
            <h3>📊 Summary</h3>
            <div class="stat-grid" id="statGrid"></div>
        </section>

        <section class="plots" id="plotsContainer" style="display:none;">
            <h3>📈 Visualizations</h3>
            <div class="plot-grid" id="plotGrid"></div>
        </section>

        <section class="tables" id="tablesContainer" style="display:none;">
            <h3>📋 Top Items & Rules</h3>
            <div class="table-grid">
                <div>
                    <h4>Top 20 Frequent Items</h4>
                    <div id="itemsTable"></div>
                </div>
                <div>
                    <h4>Top 20 Rules by Lift</h4>
                    <div id="rulesTable"></div>
                </div>
            </div>
        </section>

        <section class="recommendations" id="recContainer" style="display:none;">
            <h3>🔍 Product Recommendations</h3>
            <div class="rec-search">
                <input type="text" id="recProduct" placeholder="e.g. PINK REGENCY TEACUP AND SAUCER">
                <button id="recBtn">Get Recommendations</button>
            </div>
            <div id="recResults"></div>
        </section>
    </div>
    <script src="/script.js"></script>
</body>

</html>
